spring:
  application:
    name: StudentApplication

  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/ousl_db?sslmode=disable}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:ishara123}"

