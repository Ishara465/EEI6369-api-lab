name: AWS DevSecOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-secure:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ousl_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ishara123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ousl_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_DIRECTORY: StudentApplication/StudentApplication
      DOCKERFILE_PATH: StudentApplication/dockerfile
      LOCAL_IMAGE: ousl-student-api
      ECR_REPOSITORY: student-api-eei6369-lab
      AWS_REGION: ap-southeast-2
      DB_URL: jdbc:postgresql://localhost:5432/ousl_db?sslmode=disable
      DB_USERNAME: postgres
      DB_PASSWORD: ci_test_password
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify project paths and Sonar configuration
        shell: bash
        run: |
          test -f "$DOCKERFILE_PATH" || { echo "::error::Missing $DOCKERFILE_PATH"; exit 1; }
          test -f "$APP_DIRECTORY/pom.xml" || { echo "::error::Missing $APP_DIRECTORY/pom.xml"; exit 1; }
          test -d "$APP_DIRECTORY/src" || { echo "::error::Missing $APP_DIRECTORY/src"; exit 1; }
          for key in SONAR_ORGANIZATION SONAR_PROJECT_KEY SONAR_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is missing. Check repository Actions variables and secrets."
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: StudentApplication/StudentApplication/pom.xml

      - name: Build and test
        working-directory: ${{ env.APP_DIRECTORY }}
        run: mvn -B -ntp clean verify

      - name: SonarCloud SAST and Quality Gate
        working-directory: ${{ env.APP_DIRECTORY }}
        run: >-
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization="$SONAR_ORGANIZATION"
          -Dsonar.projectKey="$SONAR_PROJECT_KEY"
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=600

      - name: Build Container
        run: docker build --pull -f "$DOCKERFILE_PATH" -t "$LOCAL_IMAGE:$GITHUB_SHA" "$APP_DIRECTORY"

      - name: Aqua Security Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ousl-student-api:${{ github.sha }}
          format: table
          output: trivy-results.txt
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: false
          scanners: vuln

      - name: Save test and scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            StudentApplication/StudentApplication/target/surefire-reports/
            trivy-results.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Container Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          if [ "$ECR_REGISTRY" != "213527446433.dkr.ecr.ap-southeast-2.amazonaws.com" ]; then
            echo "::error::AWS credentials do not point to the expected ECR registry. Check AWS account and region."
            exit 1
          fi
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker tag "$LOCAL_IMAGE:$GITHUB_SHA" "$IMAGE_URI"
          docker push "$IMAGE_URI"
          printf 'Published image: `%s`\n' "$IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"
